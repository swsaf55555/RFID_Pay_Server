<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学生卡系统管理员端</title>

  <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/admin.css') }}" rel="stylesheet">


</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand ms-2">学生卡系统管理员端</span>
    <div id="top-bar" class="hidden">
        <button class="btn btn-outline-light me-2" onclick="loadStudents()">刷新</button>
        <button class="btn btn-outline-light me-2" onclick="openEditAdminPasswdPopup()">修改管理员密码</button>
        <button class="btn btn-outline-light" onclick="logout()">退出</button>
    </div>
</nav>

<div id="layout" class="d-flex">

    <aside id="sidebar" class="bg-dark text-white p-3 hidden">
        <div class="menu-title">管理菜单</div>
        <a id="student-a" class="menu-item" href="javascript:void(0)" onclick="showSection('students')">学生管理</a>
        <a id="seller-a" class="menu-item" href="javascript:void(0)" onclick="showSection('sellers')">卖家管理</a>
    </aside>



  <div id="content-area">
    <div id="loginBox" class="card p-4 mx-auto mt-5" style="max-width:400px;">
      <h4 class="card-title mb-3 text-center">管理员登录</h4>
      <input id="username" class="form-control mb-2" placeholder="用户名" onkeydown="checkEnter(event)">
      <input id="password" type="password" class="form-control mb-2" placeholder="密码" onkeydown="checkEnter(event)">
      <button class="btn btn-primary w-100" onclick="login()">登录</button>
    </div>


    <div id="main" class="hidden">



      <div id="studentsSection">
        <div class="d-flex justify-content-between mb-3">
            <input id="searchInput" class="form-control" placeholder="按学号/姓名/卡号搜索">
        </div>
        <button class="btn btn-success mb-2" onclick="openAddPopup()">添加学生</button>

        <table class="table table-striped table-hover bg-white" id="studentTable">
          <thead class="table-dark">
            <tr>
              <th>ID</th><th>学号</th><th>姓名</th><th>卡号</th><th>余额</th><th>状态</th><th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <nav>
          <ul class="pagination justify-content-center">
            <li class="page-item"><button class="page-link" onclick="prevPageStu()">上一页</button></li>
            <li class="page-item disabled"><span class="page-link" id="pageInfoStu">第1页</span></li>
            <li class="page-item"><button class="page-link" onclick="nextPageStu()">下一页</button></li>
          </ul>
        </nav>
      </div>


      <div id="sellersSection" class="hidden">
        <div class="d-flex justify-content-between mb-3">
            <input id="searchInput-seller" class="form-control" placeholder="按ID/姓名/商户名/手机号搜索">
        </div>
        <button class="btn btn-success mb-2" onclick="openAddSellerPopup()">新增卖家</button>
        <table class="table table-striped table-hover bg-white" id="sellerTable">
          <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>姓名</th>
                <th>商户名</th>
                <th>手机号</th>
                <th>余额</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <nav>
            <ul class="pagination justify-content-center">
                <li class="page-item"><button class="page-link" onclick="prevPageSel()">上一页</button></li>
                <li class="page-item disabled"><span class="page-link" id="pageInfoSel">第1页</span></li>
                <li class="page-item"><button class="page-link" onclick="nextPageSel()">下一页</button></li>
            </ul>
        </nav>
      </div>

    </div>
  </div>
</div>



<div class="modal fade" id="popupModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="popupTitle" class="modal-title"></h5>
        <button class="btn-close" onclick="closePopup()"></button>
      </div>
      <div class="modal-body" id="popupBody"></div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="submitPopup()">提交</button>
        <button class="btn btn-secondary" onclick="closePopup()">关闭</button>
      </div>
    </div>
  </div>
</div>


<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
